name: Sign Clerk instance attestation

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write
  id-token: write

concurrency:
  group: immutable-clerk-attestation-v1
  cancel-in-progress: false

jobs:
  attest:
    if: github.run_number == 1
    runs-on: ubuntu-latest
    environment: attestation
    steps:
      - name: Checkout immutable authority policy
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install pinned cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v4.1.2

      - name: Independently read back exact Clerk instance
        env:
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          python3 scripts/build_attestation.py

      - name: Keyless-sign attestation with GitHub OIDC and Sigstore
        run: |
          set -euo pipefail
          cosign sign-blob --yes \
            --bundle clerk-instance-attestation-v1.sigstore.json \
            clerk-instance-attestation-v1.json

      - name: Verify exact Sigstore identity immediately
        run: |
          set -euo pipefail
          cosign verify-blob \
            --bundle clerk-instance-attestation-v1.sigstore.json \
            --certificate-identity 'https://github.com/chrizzatsu/acc-attestation-authority/.github/workflows/sign-clerk-attestation.yml@refs/heads/main' \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            clerk-instance-attestation-v1.json
          sha256sum authority-policy.json clerk-instance-attestation-v1.json clerk-instance-attestation-v1.sigstore.json > SHA256SUMS

      - name: Publish immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create clerk-instance-attestation-v1 \
            --target "$GITHUB_SHA" \
            --title 'ACC Clerk instance attestation v1' \
            --notes 'Owner-authorized, exact-instance, development-only, zero-incremental-spend TR-01D attestation. Verify the Sigstore bundle and policy before use.' \
            authority-policy.json \
            clerk-instance-attestation-v1.json \
            clerk-instance-attestation-v1.sigstore.json \
            SHA256SUMS
